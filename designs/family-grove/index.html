<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>一起成长 · 每日工作台（设计原型）</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root">
  <div class="boot" id="boot" data-screen-label="载入">
    <h1>一起成长 · 设计原型</h1>
    <p id="boot-msg">正在载入交互原型…</p>
    <p>原型从 unpkg.com 取得固定版本的 React 18.3.1 与 Babel 7.29.0（带 SRI 校验），其余文件都在本目录。演示数据都是虚构的，不连接家庭后台。</p>
  </div>
</div>
<script>
  (function () {
    function fail(what) {
      var m = document.getElementById('boot-msg');
      if (m) m.textContent = '没能载入' + what + '。原型需要连上 unpkg.com 取得固定版本脚本，联网后刷新即可。';
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'SCRIPT') fail('脚本 ' + (t.getAttribute('src') || ''));
    }, true);
    setTimeout(function () { if (document.getElementById('boot')) fail('交互脚本（网络较慢或连不上）'); }, 25000);
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app.js"></script>
</body>
</html>
